name: Editor checks
on:
  push:
    branches: [main, docs/editor-foundation, feat/editor-core-slice]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_IF: '^(docs/.*|.*\.md|LICENSE|\.github/workflows/deploy-pages\.yml)$'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Build, domain and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Domain tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflow smoke
        run: npm run test:e2e
      - name: Record browser texture resource baseline
        run: |
          test -s test-results/performance/texture-lifecycle.json
          cat test-results/performance/texture-lifecycle.json
      - name: Build GitHub Pages production bundle
        run: npm run build -- --mode github-pages
      - name: Test production site at /3dMc/ (not Vite dev)
        run: npx playwright test --config playwright.pages.config.ts
      - name: Record reproducible source and release evidence
        if: always()
        run: |
          mkdir -p test-results/evidence
          git archive --format=tar.gz HEAD > test-results/evidence/source-snapshot.tar.gz
          node scripts/release-evidence.mjs
      - name: Upload browser screenshot and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-workspace-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  cross_browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Firefox and WebKit creator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Firefox and WebKit engines
        run: npx playwright install --with-deps firefox webkit
      - name: Run non-Chromium creator smoke
        run: npx playwright test --config playwright.matrix.config.ts
      - name: Upload non-Chromium failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-browser-matrix
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
